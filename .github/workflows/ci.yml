# CI del backend (HU-38): compila en Release y ejecuta todas las pruebas xUnit en cada PR y push a main.
# No usa secretos: las pruebas HTTP usan autenticación falsa y repositorios en memoria.
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: el job solo necesita leer el código.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FlowTrim.slnx

      - name: Build (Release)
        run: dotnet build FlowTrim.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FlowTrim.slnx -c Release --no-build --logger "console;verbosity=normal"

  # HU-40: la imagen que usa Render se construye y arranca en cada PR (sin secretos: configuración ficticia).
  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag flowtrim-api:ci .

      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id flowtrim-api:ci -u)" != "0"

      - name: Starts and answers the health check
        run: |
          # Base de datos inexistente a proposito: la API debe arrancar y el health check responder 503 sin detalles.
          docker run --detach --name api --publish 10000:10000 \
            --env ConnectionStrings__FlowTrimDb="Host=127.0.0.1;Port=1;Database=none;Username=none;Password=none;Timeout=2" \
            --env Authentication__Authority="https://issuer.example.test/" \
            --env Authentication__Audience="https://api.flowtrim.dev" \
            --env Cors__AllowedOrigins__0="https://app.flowtrim.test" \
            flowtrim-api:ci
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /tmp/health.json --write-out '%{http_code}' http://localhost:10000/api/health || true)
            if [ "$status" = "503" ] || [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          echo "health status: $status"
          cat /tmp/health.json; echo
          docker logs api | tail -20
          test "$status" = "503"
          # Sin trazas ni cadenas de conexion en la respuesta.
          ! grep -qiE "exception|password|host=" /tmp/health.json

      - name: Protected endpoint requires a token
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:10000/api/accounts)" = "401"
